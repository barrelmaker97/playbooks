# One Kustomization per app, so a failure is reported by app name and blocks
# nothing else. Apps in the shared barrelmaker namespace wait for the
# Kustomization that creates it. wait: true makes each one Ready only once
# everything it applied is healthy, including its HelmRelease.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barrelmaker
  namespace: flux-system
spec:
  path: ./kubernetes/apps/barrelmaker
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dotfiles
  namespace: flux-system
spec:
  path: ./kubernetes/apps/dotfiles
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: barrelmaker
---
