# One Kustomization per app, so a failure is reported by app name and blocks
# nothing else. wait: true makes each one Ready only once everything it
# applied is healthy, including its HelmRelease. An app depends on:
#   barrelmaker        if it lives in the shared barrelmaker namespace
#   monitoring-prereq  if it creates ServiceMonitors, PodMonitors or
#                      PrometheusRules
#   cloudnative-pg     if it has a PostgreSQL Cluster
#   longhorn-config    if it has volumes
#   gateway            if it has routes
#
# App HelmReleases fail forward: a failed install or upgrade is retried as
# written every 15 minutes, never rolled back or uninstalled. Fix with a
# commit; a StatefulSet stuck on a bad pod also needs that pod deleted by hand.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barrelmaker
  namespace: flux-system
spec:
  path: ./kubernetes/apps/barrelmaker
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
---
