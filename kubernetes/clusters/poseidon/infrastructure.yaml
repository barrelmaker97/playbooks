# The cluster platform, one Kustomization per layer, ordered by dependsOn
# from the bottom up. These differ from the apps on purpose:
#   prune: false  removing a file never removes the platform; deleting
#                 infrastructure is a deliberate manual step.
#   wait: true    a layer is Ready only once everything in it is healthy,
#                 which is what the layers above wait for.
# A chart and the custom resources it defines are separate Kustomizations
# (metallb and metallb-config): Flux validates a Kustomization as a whole
# before applying it, so the resources cannot ship with the CRDs they need.
#
# Infrastructure guards, on every HelmRelease in these layers:
#   RetryOnFailure  a failed install or upgrade is retried as written every
#                   15 minutes, never rolled back or uninstalled, so the
#                   cluster does not drift from Git. Roll back with git revert.
#   driftDetection  changes made by hand to chart objects are reverted.
#   CRDs keep       a post-renderer marks every CRD helm.sh/resource-policy:
#                   keep. Deleting a CRD deletes every object of its kind, so
#                   no release removal may take one.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/flux-notifications
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  prune: false
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

# Layer 0: everything else renders ServiceMonitors, PodMonitors or
# PrometheusRules into these CRDs.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-prereq
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/monitoring-prereq
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true

# Layer 1: independent of each other; each needs the monitoring CRDs for
# its ServiceMonitors or PodMonitors.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/metallb
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/metallb-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: metallb
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/cert-manager-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: cert-manager
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/longhorn
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/longhorn-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: longhorn

# Layer 2: needs the monitoring CRDs, and Longhorn's storage classes for the
# Prometheus, Alertmanager, Loki and Tempo volumes.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: monitoring-prereq
    - name: longhorn-config
  decryption:
    provider: sops
    secretRef:
      name: sops-age

# Layer 3: the Gateway on top of everything below it, then the routes to the
# platform UIs, which need the services they route to.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: envoy-gateway
    - name: cert-manager-config
    - name: metallb-config
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: routing
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/routing
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: false
  wait: true
  dependsOn:
    - name: gateway
    - name: monitoring
    - name: longhorn
  decryption:
    provider: sops
    secretRef:
      name: sops-age
