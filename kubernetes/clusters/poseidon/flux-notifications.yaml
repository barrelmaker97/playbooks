---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/flux-notifications
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
