---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devscura
  namespace: flux-system
spec:
  path: ./kubernetes/apps/devscura
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  # Ready only once every object it applied is healthy, the HelmRelease and
  # the CNPG Cluster included.
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
