---
# Settings every HelmRelease shares, so a HelmRelease file holds only its
# chart, values and dependsOn. Every kustomization.yaml with a HelmRelease
# lists this under components. A patch overrides the same field set in a file,
# so a release that needs something else changes its chart values instead
# (kube-prometheus-stack turns its CRDs off rather than setting crds: Skip).
# The flux-operator release in clusters/poseidon/flux-system sets these
# itself: it is applied before anything else exists.
#
#   RetryOnFailure  a failed install or upgrade is retried as written every
#                   15 minutes, never rolled back or uninstalled, so the
#                   cluster does not drift from Git. Fix with a commit or git
#                   revert; a StatefulSet stuck on a bad pod also needs that
#                   pod deleted by hand.
#   driftDetection  changes made by hand to chart objects are reverted.
#   CRDs            installed and upgraded with the chart (CreateReplace),
#                   and a post-renderer marks each one helm.sh/resource-policy:
#                   keep. Deleting a CRD deletes every object of its kind, so
#                   no release removal may take one.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: any
      spec:
        interval: 30m
        postRenderers:
          - kustomize:
              patches:
                - target:
                    kind: CustomResourceDefinition
                  patch: |
                    apiVersion: apiextensions.k8s.io/v1
                    kind: CustomResourceDefinition
                    metadata:
                      name: any
                      annotations:
                        helm.sh/resource-policy: keep
        install:
          crds: CreateReplace
          strategy:
            name: RetryOnFailure
            retryInterval: 15m
        upgrade:
          crds: CreateReplace
          cleanupOnFail: true
          strategy:
            name: RetryOnFailure
            retryInterval: 15m
        driftDetection:
          mode: enabled
