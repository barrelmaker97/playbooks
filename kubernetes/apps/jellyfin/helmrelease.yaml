---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: barrelmaker
spec:
  releaseName: jellyfin
  chart:
    spec:
      chart: jellyfin
      # Any 0.6.x patch release: Flux upgrades within an hour of a new
      # chart version, and stops at 0.7.0.
      version: "0.6.x"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  interval: 30m
  # Fail forward: a failed action is retried as written, never rolled back
  # or uninstalled. Fix with a commit; a stuck StatefulSet pod also needs
  # deleting by hand.
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  driftDetection:
    mode: enabled
  values:
    persistence:
      config:
        storageClassName: longhorn-protected
        size: 3Gi
      media:
        storageClassName: jellyfin-media
        size: 50Gi

    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    httpRoute:
      enabled: true
      parentRefs:
        - name: "poseidon"
          namespace: "envoy-gateway-system"
          sectionName: "https-wildcard"
      hostnames:
        - "jellyfin.barrelmaker.dev"

    resources:
      requests:
        cpu: 700m
        memory: 1000Mi
      limits:
        memory: 1500Mi
