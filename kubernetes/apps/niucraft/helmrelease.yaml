---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: niucraft
  namespace: barrelmaker
spec:
  releaseName: niucraft
  chart:
    spec:
      chart: minecraft
      # Any 0.x release: Flux upgrades within an hour of a new chart
      # version, and stops at 1.0.0.
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  interval: 30m
  # Fail forward: a failed action is retried as written, never rolled back
  # or uninstalled. Fix with a commit; a stuck StatefulSet pod also needs
  # deleting by hand.
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  driftDetection:
    mode: enabled
  values:
    persistence:
      storageClassName: longhorn-protected
      size: 40Gi

    dynmap:
      enabled: true
      cores: 1
      showOfflinePlayers: true
      showSpawnBeds: true
      config:
        resources:
          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            memory: 30Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      httpRoute:
        enabled: true
        parentRefs:
          - name: "poseidon"
            namespace: "envoy-gateway-system"
            sectionName: "https-wildcard"
        hostnames:
          - "niucraft.barrelmaker.dev"
        filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              set:
                - name: "Strict-Transport-Security"
                  value: "max-age=63072000; includeSubDomains; preload"
                - name: "Referrer-Policy"
                  value: "same-origin"
                - name: "X-Content-Type-Options"
                  value: "nosniff"

    metrics:
      enabled: true
      dashboard:
        enabled: true
      serviceMonitor:
        enabled: true

    properties:
      aikarFlags: true
      enforceWhitelist: true
      memory: "6G"
      motd: "NIUCraft Server"
      ops: "Barrelmaker97"
      existingWhitelist: "SYNCHRONIZE"
      existingOps: "SYNCHRONIZE"
      paperChannel: "default"
      serverName: "NIUCraft"
      modrinthProjects: >-
        fabric-api,
        fabricexporter,
        spark,
        chunky,
        dynmap,
        minecraft-sqlite-jdbc
      type: "FABRIC"
      version: "1.21.11"
      viewDistance: "32"
      whitelist: >-
        BakerGang2022,
        Barrelmaker97,
        Lil_Doza,
        LuckierDodge,
        Solo22499,
        Spronix,
        ThePrimeus,
        Celery_Trainer,
        ninjahomie7

    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    service:
      type: LoadBalancer
      port: 25565

    resources:
      requests:
        cpu: 1000m
        memory: 7500Mi
      limits:
        memory: 8000Mi
