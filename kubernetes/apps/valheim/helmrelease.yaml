---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valheim
  namespace: barrelmaker
spec:
  releaseName: valheim
  chart:
    spec:
      chart: valheim
      # Any 0.x release: Flux upgrades within an hour of a new chart
      # version, and stops at 1.0.0.
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  interval: 30m
  # Fail forward: a failed action is retried as written, never rolled back
  # or uninstalled. Fix with a commit; a stuck StatefulSet pod also needs
  # deleting by hand.
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: Secret
      name: valheim-values
