---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valheim
  namespace: barrelmaker
spec:
  releaseName: valheim
  chart:
    spec:
      chart: valheim
      version: "0.6.0"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  valuesFrom:
    - kind: Secret
      name: valheim-values
  values:
    serverName: Barrelmaker
    worldName: Asgard
    public: false
    metrics: true

    persistence:
      storageClassName: longhorn-protected
      size: 10Gi

    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      runAsUser: 111
      runAsGroup: 1000
      fsGroup: 1000

    service:
      type: LoadBalancer
      port: 2456

    resources:
      requests:
        cpu: 700m
        memory: 3000Mi
      limits:
        memory: 4000Mi
