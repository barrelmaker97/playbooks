---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pistachio
  namespace: barrelmaker
spec:
  releaseName: pistachio
  chart:
    spec:
      chart: pistachio
      version: "0.3.1"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  interval: 30m
  # Fail forward: a failed action is retried as written, never rolled back
  # or uninstalled. Fix with a commit; a stuck StatefulSet pod also needs
  # deleting by hand.
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  driftDetection:
    mode: enabled
  values:
    pistachio:
      ups:
        host: pollux.lan

    replicaCount: 2 # For faster failover

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: pistachio
            app.kubernetes.io/instance: pistachio
        matchLabelKeys:
          - pod-template-hash

    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 10m
        memory: 5Mi
      limits:
        memory: 10Mi

    dashboard:
      enabled: true

    serviceMonitor:
      enabled: true

    prometheusRules:
      enabled: true
