---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obscura
resources:
  - ../base
  - postgres-prometheusrule.yaml
patches:
  - path: helmrelease.yaml
    target:
      kind: HelmRelease
      name: obscura

# kustomize-controller decrypts values.sops.yaml before building; see
# kubernetes/apps/loch/kustomization.yaml.
secretGenerator:
  - name: obscura-values
    files:
      - values.yaml=values.sops.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
