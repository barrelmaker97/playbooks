---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obscura
  namespace: obscura
spec:
  releaseName: obscura
  chart:
    spec:
      chart: obscura
      version: "0.14.1"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  valuesFrom:
    - kind: Secret
      name: obscura-values
  values:
    replicaCount: 3

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 3
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: obscura
            app.kubernetes.io/instance: obscura
        matchLabelKeys:
          - pod-template-hash

    obscura:
      database:
        existingSecret:
          name: obscura-postgres-app
          key: uri
      telemetry:
        otlpEndpoint: http://otel.monitoring.svc.cluster.local:4317
        logFormat: json
      server:
        trustedProxies: 10.244.0.0/16
      fcm:
        projectId: obscura-af88b

    postgresql:
      enabled: false

    rustfs:
      storageclass:
        name: longhorn-protected
        dataStorageSize: 10Gi
      secret:
        rustfs:
          access_key: obscura
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

    httpRoute:
      enabled: true
      parentRefs:
        - name: "poseidon"
          namespace: "envoy-gateway-system"
          sectionName: "https-wildcard"
      hostnames:
        - "obscura.barrelmaker.dev"

    securityPolicy:
      cors:
        enabled: true
        allowOrigins:
          - https://*.obscura-client-web.pages.dev
          - https://obscura-client-web.pages.dev
