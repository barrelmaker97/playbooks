---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: obscura-postgres
  namespace: obscura-dev
spec:
  groups:
    - name: obscura-postgres.availability
      rules:
        - alert: CloudNativePGInstancesNotReady
          expr: >-
            (
              count(
                up{
                  job="obscura-dev/obscura-postgres"
                } == 1
              )
              or vector(0)
            ) < 1
          for: 2m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura-dev/obscura-postgres
            namespace: obscura-dev
          annotations:
            summary: >-
              CloudNativePG cluster obscura-dev/obscura-postgres
              has unavailable instances
            description: >-
              Fewer than 1 PostgreSQL
              instances have healthy Prometheus scrape targets.

        - alert: CloudNativePGPostgresDown
          expr: >-
            cnpg_collector_up{
              job="obscura-dev/obscura-postgres"
            } == 0
          for: 1m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura-dev/obscura-postgres
            namespace: obscura-dev
          annotations:
            summary: >-
              PostgreSQL is unavailable on {{ $labels.pod }}
            description: >-
              The CloudNativePG collector cannot connect to PostgreSQL on
              {{ $labels.pod }}.

    - name: obscura-postgres.operations
      rules:
        - alert: CloudNativePGLongRunningTransaction
          expr: >-
            cnpg_backends_max_tx_duration_seconds{
              job="obscura-dev/obscura-postgres"
            } > 300
          for: 1m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura-dev/obscura-postgres
            namespace: obscura-dev
          annotations:
            summary: >-
              PostgreSQL transaction on {{ $labels.pod }} exceeds five minutes
            description: >-
              A transaction has remained open for more than 300 seconds.

        - alert: CloudNativePGDatabaseXIDAgeHigh
          expr: >-
            max by (namespace, job, datname) (
              cnpg_pg_database_xid_age{
                job="obscura-dev/obscura-postgres"
              }
            ) > 300000000
          for: 5m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura-dev/obscura-postgres
            namespace: obscura-dev
          annotations:
            summary: >-
              PostgreSQL database {{ $labels.datname }} has high transaction ID age
            description: >-
              Transaction ID age has exceeded 300 million and requires vacuum
              investigation.

        - alert: CloudNativePGDeadlocksDetected
          expr: >-
            sum by (namespace, job, datname) (
              increase(
                cnpg_pg_stat_database_deadlocks{
                  job="obscura-dev/obscura-postgres",
                  datname!=""
                }[10m]
              )
            ) > 0
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura-dev/obscura-postgres
            namespace: obscura-dev
          annotations:
            summary: >-
              PostgreSQL deadlocks detected in {{ $labels.datname }}
            description: >-
              One or more deadlocks occurred during the last ten minutes.

        - alert: CloudNativePGMetricsCollectionError
          expr: >-
            cnpg_collector_last_collection_error{
              job="obscura-dev/obscura-postgres"
            } == 1
          for: 2m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura-dev/obscura-postgres
            namespace: obscura-dev
          annotations:
            summary: >-
              CloudNativePG metrics collection failed on {{ $labels.pod }}
            description: >-
              The PostgreSQL metrics collector has reported an error for two
              minutes.
