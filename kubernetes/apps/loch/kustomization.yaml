---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
components:
  - ../../components/helmrelease

# kustomize-controller decrypts values.sops.yaml before building; see
# kubernetes/apps/devscura/kustomization.yaml.
secretGenerator:
  - name: loch-values
    namespace: barrelmaker
    files:
      - values.yaml=values.sops.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
