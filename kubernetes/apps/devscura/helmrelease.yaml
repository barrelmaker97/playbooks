---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devscura
  namespace: obscura-dev
spec:
  # Matches the release the workloads role installed, so helm-controller
  # upgrades it in place rather than installing a second copy.
  releaseName: devscura
  chart:
    spec:
      chart: obscura
      version: 0.13.1
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  interval: 30m
  timeout: 5m
  maxHistory: 5
  # The equivalents of the --atomic and --cleanup-on-fail flags the helm role
  # passes.
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
  # Report drift as events without correcting it yet. Switch to enabled once
  # the events show nothing unexpected.
  driftDetection:
    mode: warn
  # The sops values only add keys that the values below do not set, so the
  # merge order (valuesFrom first, then values) does not change the result.
  valuesFrom:
    - kind: Secret
      name: devscura-values
  values:
    replicaCount: 3

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 3
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: obscura
            app.kubernetes.io/instance: devscura
        matchLabelKeys:
          - pod-template-hash

    obscura:
      database:
        existingSecret:
          name: devscura-postgres-app
          key: uri
      telemetry:
        otlpEndpoint: http://otel.monitoring.svc.cluster.local:4317
        logFormat: json
      server:
        trustedProxies: 10.244.0.0/16
      fcm:
        projectId: obscura-af88b

    postgresql:
      enabled: false

    rustfs:
      storageclass:
        name: longhorn-protected
        dataStorageSize: 10Gi
      secret:
        rustfs:
          access_key: obscura
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      podSecurityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

    bucketSetup:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

    podSecurityContext:
      fsGroup: 10001
      runAsGroup: 10001
      runAsUser: 10001
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    httpRoute:
      enabled: true
      parentRefs:
        - name: ${gateway_name}
          namespace: ${gateway_namespace}
          sectionName: ${gateway_public_listener_name}
      hostnames:
        - devscura.${external_domain}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            # Mirrors gateway_response_headers in group_vars/all.yaml.
            # Substitution only handles strings, so the list is written out.
            set:
              - name: Strict-Transport-Security
                value: max-age=63072000; includeSubDomains; preload
              - name: Referrer-Policy
                value: same-origin
              - name: X-Content-Type-Options
                value: nosniff

    securityPolicy:
      cors:
        enabled: true
        allowOrigins:
          - https://*.obscura-client-web.pages.dev
          - https://obscura-client-web.pages.dev
