---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: devscura-postgres
  namespace: obscura-dev
  annotations:
    # Pruning the Cluster would take its volumes with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  description: Development PostgreSQL cluster for Obscura
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:79be0d10e78b7ac4520cf6c5db199a8bb7f6de53b3229f47e90cab5865528a0d
  enablePDB: false
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: obscura
      owner: obscura
      dataChecksums: true
  storage:
    storageClass: longhorn-cnpg-local
    size: 8Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  postgresql:
    parameters:
      idle_in_transaction_session_timeout: 5min
      track_io_timing: "on"
      track_wal_io_timing: "on"
    pg_hba:
      - hostnossl all all all reject
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
