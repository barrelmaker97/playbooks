---
# The LAN routes' certificate, from the internal CA: Let's Encrypt cannot
# issue for .lan names.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lan
  namespace: envoy-gateway-system
spec:
  secretName: wildcard-lan-tls
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
  dnsNames:
    - "*.poseidon.lan"
---
# The public certificate, issued by DNS-01 through Cloudflare, which needs no
# host reachable on port 80.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-public
  namespace: envoy-gateway-system
spec:
  secretName: wildcard-public-tls
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - barrelmaker.dev
    - "*.barrelmaker.dev"
