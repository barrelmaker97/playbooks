---
# Longhorn's own uninstall guard also stays in place: with its
# deleting-confirmation-flag setting false (the default), the chart's
# uninstall hook refuses to run.
#
# Longhorn does not support downgrades, which is one more reason this
# release is never rolled back automatically.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h
  interval: 30m
  # Infrastructure guards; see kubernetes/clusters/poseidon/infrastructure.yaml.
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  driftDetection:
    mode: enabled
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: any
                annotations:
                  helm.sh/resource-policy: keep
  values:
    persistence:
      defaultClass: false
      defaultDataLocality: best-effort
      defaultClassReplicaCount: 2
    metrics:
      serviceMonitor:
        enabled: true
    defaultSettings:
      allowVolumeCreationWithDegradedAvailability: false
      backupTarget: "nfs://soteria.lan:/volume1/longhorn-backupstore"
      concurrentReplicaRebuildPerNodeLimit: "2"
      defaultDataLocality: best-effort
      defaultDataPath: /var/mnt/longhorn
      defaultReplicaCount: "2"
      nodeDrainPolicy: allow-if-replica-is-stopped
      replicaAutoBalance: least-effort
      # Hard cap on snapshots per volume; new snapshots are blocked once reached.
      # The alerts in monitoring/prometheusrule-longhorn-snapshots.yaml fire
      # just below it; keep them in step.
      snapshotMaxCount: "50"
      storageMinimalAvailablePercentage: "10"
    httproute:
      enabled: false
