---
# The ServiceMonitor, PodMonitor and PrometheusRule CRDs that charts across
# the cluster render into. They are a release of their own so that nothing
# else's lifecycle can remove them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: monitoring
spec:
  releaseName: prometheus-operator-crds
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "32.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  interval: 30m
  # Infrastructure guards; see kubernetes/clusters/poseidon/infrastructure.yaml.
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  driftDetection:
    mode: enabled
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: any
                annotations:
                  helm.sh/resource-policy: keep
