---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 1h
  interval: 30m
  # Infrastructure guards; see kubernetes/clusters/poseidon/infrastructure.yaml.
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  driftDetection:
    mode: warn
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: any
                annotations:
                  helm.sh/resource-policy: keep
  values:
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 192Mi
    speaker:
      ignoreExcludeLB: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    frrk8s:
      enabled: false
    prometheus:
      namespace: monitoring
      rbacPrometheus: false
      serviceMonitor:
        enabled: true
