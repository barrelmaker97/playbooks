---
# The monitoring stack, its configuration and its alert rules. The
# AlertmanagerConfig and PrometheusRules need only the CRDs from
# monitoring-prereq, so they can ship alongside the charts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - limitrange.yaml
  - secret-grafana-admin-credentials.sops.yaml
  - secret-additional-scrape-configs.yaml
  - kube-prometheus-stack.yaml
  - loki.yaml
  - tempo.yaml
  - otel-collector.yaml
  - metrics-server.yaml
  - secret-discord-webhook-url.sops.yaml
  - alertmanagerconfig.yaml
  - prometheusrule-longhorn-snapshots.yaml
  - prometheusrule-dewpoint.yaml
  - podmonitor-flux.yaml
  - prometheusrule-flux.yaml

# Grafana dashboards, one JSON file each in dashboards/, which Grafana's
# sidecar loads by the grafana_dashboard label. Export a dashboard from Grafana
# and drop it in as a file. The name stays fixed: this layer is never pruned,
# so a hashed name would leave every old copy behind for the sidecar to load.
configMapGenerator:
  - name: dashboards
    namespace: monitoring
    files:
      - dashboards/homelab-nodes.json
      - dashboards/openwrt.json
      - dashboards/dewpoint.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
