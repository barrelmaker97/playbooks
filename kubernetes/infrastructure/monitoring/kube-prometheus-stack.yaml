---
# crds: Skip because the chart bundles its own copy of the Prometheus
# CRDs, at an older operator version than prometheus-operator-crds in
# monitoring-prereq, which owns them. CreateReplace here would downgrade them
# on every upgrade. Helm never touched the bundled copy under Ansible either.
#
# The Grafana datasource values escape Grafana's own interpolation as $${...}.
# This Kustomization has no postBuild substitution; if one is added, mark this
# file kustomize.toolkit.fluxcd.io/substitute: disabled.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "82.13.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  interval: 30m
  # Infrastructure guards; see kubernetes/clusters/poseidon/infrastructure.yaml.
  install:
    crds: Skip
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  upgrade:
    crds: Skip
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 15m
  driftDetection:
    mode: enabled
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: any
                annotations:
                  helm.sh/resource-policy: keep
  values:
    kubeEtcd:
      enabled: true
      # Literal node IPs: Kubernetes Endpoints reject hostnames.
      endpoints:
        - "192.168.15.41"
        - "192.168.15.42"
        - "192.168.15.43"
    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
    kubeControllerManager:
      service:
        selector:
          k8s-app: kube-controller-manager
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 5m
            memory: 64Mi
          limits:
            memory: 128Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi
    alertmanager:
      alertmanagerSpec:
        alertmanagerConfigMatcherStrategy:
          type: None
        resources:
          requests:
            cpu: 10m
            memory: 200Mi
          limits:
            memory: 512Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-protected
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
      route:
        main:
          enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin-credentials
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          memory: 512Mi
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 128Mi
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: false
          jsonData:
            derivedFields:
              - name: "trace_id"
                matcherType: "label"
                matcherRegex: "trace_id"
                url: "$${__value.raw}"
                datasourceUid: "tempo"
                urlDisplayLabel: "Trace: $${__value.raw}"
        - name: Tempo
          type: tempo
          uid: tempo
          url: http://tempo.monitoring.svc.cluster.local:3200
          access: proxy
          isDefault: false
          jsonData:
            tracesToLogsV2:
              customQuery: true
              datasourceUid: "loki"
              query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
              tags:
                - key: "service.name"
                  value: "service_name"
            serviceMap:
              datasourceUid: "prometheus"
            search:
              hide: false
            nodeGraph:
              enabled: true
            lokiSearch:
              datasourceUid: "loki"
      grafana.ini:
        auth:
          login_cookie_name: __Host-grafana_session
        security:
          cookie_samesite: strict
          cookie_secure: true
          x_content_type_options: false
          content_security_policy: true
          content_security_policy_template: >-
            """
            base-uri 'self';
            connect-src 'self' grafana.com ws://$ROOT_PATH wss://$ROOT_PATH data:;
            default-src 'none';
            font-src 'self';
            form-action 'self';
            frame-ancestors 'self';
            img-src 'self' https://grafana.com data:;
            manifest-src 'self';
            media-src 'none';
            object-src 'none';
            script-src 'unsafe-eval' 'strict-dynamic' $NONCE;
            style-src 'self' 'unsafe-inline' blob:;
            worker-src 'self' blob:;
            """
    prometheus:
      route:
        main:
          enabled: false
      prometheusSpec:
        enableRemoteWriteReceiver: true
        retention: 30d
        resources:
          requests:
            cpu: 250m
            memory: 2300Mi
          limits:
            memory: 4Gi
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        additionalScrapeConfigsSecret:
          enabled: true
          name: additional-scrape-configs
          key: prometheus-additional.yaml
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-monitoring
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi
