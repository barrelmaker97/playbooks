---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  releaseName: tempo
  chart:
    spec:
      chart: tempo
      version: "1.26.7"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 1h
  values:
    tempo:
      retention: 720h
      reportingEnabled: false
      receivers:
        opencensus: {}
      resources:
        requests:
          cpu: 10m
          memory: 384Mi
        limits:
          memory: 2Gi
    persistence:
      enabled: true
      storageClassName: longhorn-protected
      size: 10Gi
