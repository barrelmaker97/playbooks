# StorageClass parameters are immutable: changing one here fails the apply.
# Create a new class instead, as with longhorn-protected.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-cnpg-local
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  dataEngine: v1
  dataLocality: strict-local
  disableRevisionCounter: 'true'
  fsType: ext4
  numberOfReplicas: '1'
  recurringJobSelector: '[]'
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-protected
  annotations:
    storageclass.kubernetes.io/is-default-class: 'true'
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  backupTargetName: default
  dataEngine: v1
  dataLocality: best-effort
  disableRevisionCounter: 'true'
  fromBackup: ''
  fsType: ext4
  numberOfReplicas: '2'
  recurringJobSelector: '[{"name":"protected","isGroup":true}]'
  staleReplicaTimeout: '30'
  unmapMarkSnapChainRemoved: ignored
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-monitoring
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  recurringJobSelector: '[]'
  fsType: ext4
