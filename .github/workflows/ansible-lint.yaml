---
name: Ansible Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install pipx
          pipx ensurepath
          pipx install --include-deps ansible
          pipx inject --include-apps ansible ansible-lint
      - name: Lint
        run: ansible-lint
      - name: Syntax check
        # inventory.yaml is the only top-level yaml that is not a playbook.
        # Written as an if rather than "[ ... ] && continue", which would abort
        # the whole loop under the default bash -e when the test is false.
        run: |
          for playbook in *.yaml; do
            if [ "$playbook" = "inventory.yaml" ]; then continue; fi
            echo "== $playbook"
            ansible-playbook --syntax-check "$playbook"
          done
