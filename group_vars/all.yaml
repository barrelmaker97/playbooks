---
# Site-level values: identity, topology, and anything more than one role
# reads. Values only one role reads belong in that role's defaults/ -- note
# that this file silently overrides them if a key is added back here.
ansible_user: barrelmaker

# Cluster identity. cluster_host, nas_host and local_domain are the building
# blocks for the templated domains at the bottom of this file, so they belong
# here even though only one role reads each of them directly.
cluster_host: poseidon
cluster_port: 6443
cluster_user: barrelmaker
cluster_vip: 192.168.15.40
external_domain: barrelmaker.dev
local_domain: lan
nas_host: soteria

# Node topology. node_ips is only read by the core role, but it stays here
# alongside node_names: Kubernetes Endpoints objects require literal IPs
# (hostnames are rejected), so the two lists must be kept in sync by hand.
node_names:
  - node1-poseidon
  - node2-poseidon
  - node3-poseidon
node_ips:
  - 192.168.15.41
  - 192.168.15.42
  - 192.168.15.43

gateway_name: poseidon
gateway_namespace: envoy-gateway-system

# Shared: applied by the core role's Grafana route and by several workload
# charts to their own routes.
gateway_response_headers:
  - name: Strict-Transport-Security
    value: "max-age=63072000; includeSubDomains; preload"
  - name: Referrer-Policy
    value: "same-origin"
  - name: X-Content-Type-Options
    value: "nosniff"

install_disk: /dev/nvme0n1
interface_name: enp86s0
ntp_server: 192.168.15.1
talos_config_dir: /home/barrelmaker/.talos
talos_version: "1.13.8"

# NUT connection
nut_host: ups@192.168.15.30
nut_user: remoteuser
nut_password: hunter2

cert_expiration_seconds: 2592000  # 30 days
kubectl_cnpg_version: "1.30.0"

dewpoint_version: "0.1.2"

# Templated variables
cluster_domain: "{{ cluster_host }}.{{ local_domain }}"
nas_domain: "{{ nas_host }}.{{ local_domain }}"
