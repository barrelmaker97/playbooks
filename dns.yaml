---
- name: Deploy DNS Stack
  hosts: dns_servers
  become: true
  # None of these roles read ansible_facts; min keeps the per-host
  # gathering cost down on the DNS servers.
  gather_facts: true
  gather_subset: [min]
  roles:
    - role: unbound
      tags: [unbound]
    - role: pihole
      tags: [pihole]
    - role: keepalived
      tags: [keepalived]
