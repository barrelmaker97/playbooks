---
- name: Deploy DNS Stack
  hosts: dns_servers
  become: true
  # These roles read no facts; min just keeps remote gathering cheap.
  gather_facts: true
  gather_subset: [min]
  roles:
    - role: unbound
      tags: [unbound]
    - role: pihole
      tags: [pihole]
    - role: keepalived
      tags: [keepalived]
