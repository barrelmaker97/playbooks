---
argument_specs:
  main:
    short_description: Create a cluster user and write its kubeconfig
    description:
      - Generates a private key and CSR, submits and approves a
        CertificateSigningRequest, binds the user to cluster-admin, and writes
        a kubeconfig. kubectl comes from mise.toml.
      - >-
        Reads ansible_facts.env.HOME, so the calling playbook must gather at
        least the min subset.
      - >-
        Also chowns the kubeconfig directory to ansible_user. That is the
        connection account rather than a role input - group_vars/all.yaml sets
        it for every host, including the DNS servers this role never touches -
        so it is deliberately not declared as an option below.
    options:
      user_name:
        description:
          - Username. Becomes the certificate common name, the CSR object name
            and the kubeconfig context user.
        type: str
        required: true
      cluster_host:
        description: Short cluster name used for the kubeconfig cluster entry.
        type: str
        required: true
      cluster_domain:
        description: Domain the API server is reachable at.
        type: str
        required: true
      cluster_port:
        description: API server port.
        type: int
        required: true
      cluster_vip:
        description: Virtual IP talosctl targets to fetch the admin kubeconfig.
        type: str
        required: true
      cert_expiration_seconds:
        description: Requested lifetime of the signed client certificate.
        type: int
        required: true
