---
- name: Template machine config patch for {{ item }}
  ansible.builtin.template:
    src: controlplane-patch.yaml.j2
    dest: "{{ talos_config_dir }}/patch.yaml"
    mode: "0644"
  vars:
    node_hostname: "{{ item }}"

# --talos-version v1.13 keeps the single-document config format the nodes
# run: from 1.14, gen config emits separate documents (KubeAPIServerConfig,
# KubeletConfig, ...) that conflict with this patch's cluster and machine
# settings, and KubeletConfig has no field for the Longhorn mount.
- name: Generate machine config for {{ item }}
  changed_when: true
  ansible.builtin.command: >
    sops exec-file "{{ role_path }}/files/secrets.sops.yaml"
    'talosctl gen config --force
    --talos-version v1.13
    --with-docs=false
    --with-examples=false
    --with-secrets {}
    --config-patch-control-plane "@{{ talos_config_dir }}/patch.yaml"
    --output-types=controlplane
    --output "{{ talos_config_dir }}/{{ item }}.yaml"
    "{{ cluster_host }}" "https://kube.{{ cluster_domain }}:{{ cluster_port }}"'
