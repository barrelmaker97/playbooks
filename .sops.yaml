# First matching rule wins. Files under kubernetes/ are also encrypted to the
# cluster key, which Flux holds as the sops-age Secret; that key can decrypt
# nothing else, so the Talos secrets and other Ansible-only files stay out of
# the cluster's reach. The cluster key itself is stored in
# roles/core/files/secret-sops-age.sops.yaml, encrypted to the personal key
# only.
creation_rules:
  - path_regex: ^kubernetes/.*\.sops\.ya?ml$
    encrypted_regex: '(^data|^stringData|^cluster|^secrets|^jwtSecret|^certs|^trustdinfo|^credentialsJson|^secret_key$|.*[Pp]assword$)'
    key_groups:
      - age:
          - age1wk5ucdcd2nzjs2ztpfhr2l0ds284p284f2c7grcmns7hsl0hp42syku7c6  # personal
          - age1d70v7e0uyptut9mjuh06zsdt7udslentsp3ernvtwhemnlgz6s3s2587sr  # cluster (Flux)
  - path_regex: .*\.sops\.ya?ml
    encrypted_regex: '(^data|^stringData|^cluster|^secrets|^jwtSecret|^certs|^trustdinfo|^credentialsJson|^secret_key$|.*[Pp]assword$)'
    key_groups:
      - age:
          - age1wk5ucdcd2nzjs2ztpfhr2l0ds284p284f2c7grcmns7hsl0hp42syku7c6
