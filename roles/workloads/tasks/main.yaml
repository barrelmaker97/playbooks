---
- name: Validate Helm Release Namespaces
  ansible.builtin.assert:
    that:
      - workload_release.value.namespace is defined
      - (workload_release.value.namespace | default("")) in workloads_namespaces
    fail_msg: >-
      Helm release {{ workload_release.key }} references an undeclared workload
      namespace.
  loop: "{{ workloads_helm_releases | dict2items }}"
  loop_control:
    loop_var: workload_release
    label: "{{ workload_release.key }}"

- name: Validate CloudNativePG Cluster Namespaces
  ansible.builtin.assert:
    that:
      - workload_postgresql_cluster.value.namespace is defined
      - >-
        (workload_postgresql_cluster.value.namespace | default(""))
        in workloads_namespaces
    fail_msg: >-
      CloudNativePG cluster {{ workload_postgresql_cluster.key }} references an
      undeclared workload namespace.
  loop: "{{ workloads_postgresql_clusters | dict2items }}"
  loop_control:
    loop_var: workload_postgresql_cluster
    label: "{{ workload_postgresql_cluster.key }}"

- name: Create Workload Namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ workload_namespace_entry.key }}"
        labels: "{{ workload_namespace_entry.value.labels }}"
  loop: "{{ workloads_namespaces | dict2items }}"
  loop_control:
    loop_var: workload_namespace_entry
    label: "{{ workload_namespace_entry.key }}"

- name: Create Workload Resource Quotas
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('template', 'resourcequota-workload.yaml') | from_yaml }}
  loop: "{{ workloads_namespaces | dict2items }}"
  loop_control:
    loop_var: workload_namespace_entry
    label: "{{ workload_namespace_entry.key }}"
  vars:
    workload_namespace_config: "{{ workload_namespace_entry.value }}"
    workload_namespace_name: "{{ workload_namespace_entry.key }}"

- name: Create Workload Limit Ranges
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('template', 'limitrange-workload.yaml') | from_yaml }}
  loop: "{{ workloads_namespaces | dict2items }}"
  loop_control:
    loop_var: workload_namespace_entry
    label: "{{ workload_namespace_entry.key }}"
  vars:
    workload_namespace_name: "{{ workload_namespace_entry.key }}"

- name: Deploy PostgreSQL Clusters
  ansible.builtin.include_role:
    name: cloudnative_pg
  loop: "{{ workloads_postgresql_clusters | dict2items }}"
  loop_control:
    loop_var: workload_postgresql_cluster
    label: "{{ workload_postgresql_cluster.key }}"
  vars:
    cloudnative_pg_cluster_name: "{{ workload_postgresql_cluster.key }}"
    cloudnative_pg_cluster: "{{ workload_postgresql_cluster.value }}"
    cloudnative_pg_image: "{{ workloads_postgresql_image }}"

- name: Set workload role path
  ansible.builtin.set_fact:
    workloads_role_path: "{{ role_path }}"

- name: Create Jellyfin Media Persistent Volume
  kubernetes.core.k8s:
    definition: "{{ lookup('template', 'pv-jellyfin-media.yaml') | from_yaml }}"

- name: Setup Helm
  ansible.builtin.include_role:
    name: helm
    tasks_from: setup
  vars:
    helm_repos:
      barrelmaker: https://charts.barrelmaker.dev

- name: Deploy Helm Charts
  ansible.builtin.include_role:
    name: helm
    tasks_from: deploy
  loop: "{{ workloads_helm_releases | dict2items }}"
  loop_control:
    loop_var: workload_release
    label: "{{ workload_release.key }}"
  vars:
    helm_chart_name: "{{ workload_release.key }}"
    helm_chart_ref: "{{ workload_release.value.ref }}"
    helm_chart_version: "{{ workload_release.value.version | default('latest') }}"
    helm_chart_timeout: "{{ workload_release.value.timeout | default('5m') }}"
    helm_chart_namespace: "{{ workload_release.value.namespace }}"
    helm_chart_values_template: >-
      {{ workloads_role_path }}/templates/values/{{ workload_release.key }}.yaml.j2
    helm_chart_sops_file: >-
      {{ workloads_role_path }}/files/{{ workload_release.key }}.sops.yaml

- name: Create Dotfiles Redirect Route
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('template', 'httproute-dotfiles.yaml.j2') | from_yaml }}
