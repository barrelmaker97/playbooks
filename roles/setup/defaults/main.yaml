---
# Values only this role reads. The setup_ prefix satisfies ansible-lint's
# var-naming[no-role-prefix] rule; group_vars/all.yaml overrides anything here.
setup_talos_version: "1.13.8"
setup_talos_config_dir: /home/barrelmaker/.talos

# Rendered into the control plane machine config patch
setup_install_disk: /dev/nvme0n1
setup_interface_name: enp86s0
setup_ntp_server: 192.168.15.1

# NUT connection for the nut-client extension. setup_nut_password is stored in
# plaintext, unlike every other credential in this repository, which are
# sops-encrypted.
setup_nut_host: ups@192.168.15.30
setup_nut_user: remoteuser
setup_nut_password: hunter2
