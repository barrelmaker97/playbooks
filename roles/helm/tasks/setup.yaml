---
- name: Install Helm
  become: true
  community.general.snap:
    name: helm
    classic: true
    channel: latest/stable

- name: Check if Helm Diff is installed
  ansible.builtin.command: helm plugin list
  register: helm_plugins
  changed_when: false

- name: Install Helm Diff
  ansible.builtin.command: helm plugin install https://github.com/databus23/helm-diff
  when: "'diff' not in helm_plugins.stdout"
  changed_when: true

- name: Add Helm Repos
  kubernetes.core.helm_repository:
    name: "{{ item.key }}"
    repo_url: "{{ item.value }}"
    state: present
  loop: "{{ helm_repos | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Refreshes the local chart index. Nothing on the machine changes in a way worth
# reporting, so this stays quiet rather than marking every run as changed.
- name: Update Helm Repos
  ansible.builtin.command: helm repo update
  changed_when: false
  when: helm_repos | default({}) | length > 0
