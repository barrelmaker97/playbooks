---
argument_specs:
  main:
    short_description: Install Flux, which deploys the cluster from Git
    description:
      - Installs the Flux Operator, the cluster's sops age key, and the
        FluxInstance that syncs kubernetes/ from Git. Flux deploys the whole
        platform and every application from there.
      - >-
        Everything below stays required on purpose - a default satisfies the
        requirement, so validation fires only if one is deleted, which surfaces
        as a clear error at role entry rather than an undefined variable deep
        inside a template.
    options:
      flux_operator_version:
        description: Version of the flux-operator chart.
        type: str
        required: true
      flux_version:
        description:
          - Flux distribution version the FluxInstance installs, as an exact version or a semver range.
        type: str
        required: true
      flux_sync_url:
        description: Git repository Flux syncs from.
        type: str
        required: true
      flux_sync_ref:
        description:
          - Git ref Flux syncs, such as refs/heads/main. Point it at a branch to try changes before merging.
        type: str
        required: true
      flux_sync_path:
        description: Directory within the repository that Flux applies.
        type: str
        required: true
