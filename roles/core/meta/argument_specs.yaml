---
argument_specs:
  main:
    short_description: Deploy cluster-wide core services
    description:
      - Installs the Flux Operator and the FluxInstance that syncs kubernetes/
        from Git, waits for the platform layers Flux owns, then deploys the
        layers not yet moved to Flux - the monitoring stack and Gateway
        routing.
      - >-
        Chart versions and this role's own tunables are supplied by the calling
        playbook. Identity and topology values shared with other roles come
        from group_vars, which the playbook's vars file outranks.
      - >-
        Everything below stays required on purpose - a default satisfies the
        requirement, so validation fires only if one is deleted, which surfaces
        as a clear error at role entry rather than an undefined variable deep
        inside a template.
    options:
      cluster_domain:
        description: Internal domain the LAN wildcard certificate and routes use.
        type: str
        required: true
      external_domain:
        description: Public domain served by the Gateway's HTTPS listeners.
        type: str
        required: true
      node_ips:
        description:
          - Literal node IPs scraped for etcd metrics. Kubernetes Endpoints
            reject hostnames, so these must track the nodes by hand.
        type: list
        elements: str
        required: true

      gateway_name:
        description: Name of the Gateway object.
        type: str
        required: true
      gateway_namespace:
        description: Namespace holding the Gateway and its certificates.
        type: str
        required: true
      gateway_http_listener_name:
        description: Name of the Gateway HTTP listener.
        type: str
        required: true
      gateway_lan_listener_name:
        description: Name of the Gateway internal HTTPS wildcard listener.
        type: str
        required: true
      gateway_apex_listener_name:
        description: Name of the Gateway public apex HTTPS listener.
        type: str
        required: true
      gateway_public_listener_name:
        description: Name of the Gateway public wildcard HTTPS listener.
        type: str
        required: true
      gateway_ip:
        description: LoadBalancer address requested from MetalLB for the Gateway.
        type: str
        required: true
      gateway_response_headers:
        description: Security headers set on external HTTPS responses.
        type: list
        elements: dict
        required: true
        options:
          name:
            description: Header name.
            type: str
            required: true
          value:
            description: Header value.
            type: str
            required: true

      longhorn_snapshot_max_count:
        description:
          - Hard cap on snapshots per volume. The snapshot alert fires just
            below this value.
        type: int
        required: true

      envoy_gateway_version:
        description: Version of the Envoy Gateway chart. OCI tags are v-prefixed.
        type: str
        required: true
      loki_version:
        description: Version of the Loki chart.
        type: str
        required: true
      tempo_version:
        description: Version of the Tempo chart.
        type: str
        required: true
      otel_collector_version:
        description: Version of the OpenTelemetry Collector chart.
        type: str
        required: true
      kube_prometheus_stack_version:
        description: Version of the kube-prometheus-stack chart.
        type: str
        required: true
      metrics_server_version:
        description: Version of the metrics-server chart.
        type: str
        required: true
      flux_operator_version:
        description: Version of the flux-operator chart.
        type: str
        required: true
      flux_version:
        description:
          - Flux distribution version the FluxInstance installs, as an exact
            version or a semver range.
        type: str
        required: true
      flux_sync_url:
        description: Git repository Flux syncs from.
        type: str
        required: true
      flux_sync_ref:
        description:
          - Git ref Flux syncs, such as refs/heads/main. Point it at a branch
            to try changes before merging.
        type: str
        required: true
      flux_sync_path:
        description: Directory within the repository that Flux applies.
        type: str
        required: true
