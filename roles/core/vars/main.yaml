---
# Ordered monitoring stack charts. These stay as data because they are a real
# deployment group with shared preflight resources and repeated Helm wiring.
core_monitoring_charts:
  - name: loki
    ref: grafana/loki
    version: "{{ loki_version }}"
    namespace: monitoring
  - name: tempo
    ref: grafana-community/tempo
    version: "{{ tempo_version }}"
    namespace: monitoring
  - name: otel-collector
    ref: open-telemetry/opentelemetry-collector
    version: "{{ otel_collector_version }}"
    namespace: monitoring
  - name: kube-prometheus-stack
    ref: prometheus-community/kube-prometheus-stack
    version: "{{ kube_prometheus_stack_version }}"
    namespace: monitoring
  - name: metrics-server
    ref: metrics-server/metrics-server
    version: "{{ metrics_server_version }}"
    namespace: kube-system
