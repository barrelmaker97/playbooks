---
# Chart deployments, as ordered data rather than repeated task blocks. These
# live in vars/ rather than defaults/ because the list is how the role works,
# not something a site should override; the versions it interpolates are the
# overridable part and come from the calling playbook.
#
# Order is load-bearing in both lists. A values template is optional: the helm
# role looks for templates/values/<name>.yaml.j2 and skips it when absent,
# which is how prometheus-operator-crds gets deployed without one.

# Charts that install CRDs, or that other charts need in place first. Deployed
# before anything that creates a custom resource.
core_operator_charts:
  # Supplies monitoring.coreos.com. Several charts below switch on a
  # ServiceMonitor, so this has to come first.
  - name: prometheus-operator-crds
    ref: prometheus-community/prometheus-operator-crds
    version: "{{ prometheus_crds_version }}"
    namespace: monitoring

  # Supplies the Gateway API CRDs, in its chart's crds/ directory. Longhorn
  # below renders an HTTPRoute, so it cannot come before this.
  - name: envoy-gateway
    ref: oci://docker.io/envoyproxy/gateway-helm
    version: "{{ envoy_gateway_version }}"
    namespace: "{{ gateway_namespace }}"

  # Supplies cert-manager.io, which the certificates section needs
  - name: cert-manager
    ref: jetstack/cert-manager
    version: "{{ cert_manager_version }}"
    namespace: cert-manager

  # Supplies trust.cert-manager.io and depends on cert-manager
  - name: trust-manager
    ref: jetstack/trust-manager
    version: "{{ trust_manager_version }}"
    namespace: cert-manager

  # Supplies metallb.io
  - name: metallb
    ref: metallb/metallb
    version: "{{ metallb_version }}"
    namespace: metallb-system

  # Supplies longhorn.io. Renders both a ServiceMonitor and an HTTPRoute, so it
  # depends on the first two entries above.
  - name: longhorn
    ref: longhorn/longhorn
    version: "{{ longhorn_version }}"
    namespace: longhorn-system

  # Supplies postgresql.cnpg.io, used by the workloads role
  - name: cloudnative-pg
    ref: cloudnative-pg/cloudnative-pg
    version: "{{ cloudnative_pg_chart_version }}"
    namespace: cnpg-system

# Charts that consume the platform rather than extend it. These are deployed
# from the monitoring section, after the secrets and config they reference:
# kube-prometheus-stack in particular names an existing secret for the Grafana
# admin credentials and another for the extra scrape configs, and would fail
# its --wait if either were missing.
core_monitoring_charts:
  - name: loki
    ref: grafana/loki
    version: "{{ loki_version }}"
    namespace: monitoring
  - name: tempo
    ref: grafana-community/tempo
    version: "{{ tempo_version }}"
    namespace: monitoring
  - name: otel-collector
    ref: open-telemetry/opentelemetry-collector
    version: "{{ otel_collector_version }}"
    namespace: monitoring
  - name: kube-prometheus-stack
    ref: prometheus-community/kube-prometheus-stack
    version: "{{ kube_prometheus_stack_version }}"
    namespace: monitoring
  - name: metrics-server
    ref: metrics-server/metrics-server
    version: "{{ metrics_server_version }}"
    namespace: kube-system
