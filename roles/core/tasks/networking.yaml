---
- name: Create MetalLB Namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: metallb-system
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

- name: Deploy networking charts
  ansible.builtin.include_role:
    name: helm
    tasks_from: deploy
  loop: "{{ core_networking_charts }}"
  loop_control:
    loop_var: core_chart
    label: "{{ core_chart.name }}"
  vars:
    helm_chart_name: "{{ core_chart.name }}"
    helm_chart_ref: "{{ core_chart.ref }}"
    helm_chart_version: "{{ core_chart.version }}"
    helm_chart_namespace: "{{ core_chart.namespace }}"
    helm_chart_values_template: >-
      {{ core_role_path }}/templates/values/{{ core_chart.name }}.yaml.j2

- name: Create IP Address Pool
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('template', 'ipaddresspool-metallb.yaml.j2') | from_yaml }}

- name: Advertise Load Balanced IP
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('file', 'files/l2advertisement-metallb.yaml') | from_yaml }}"

- name: Create Envoy Proxy Config
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'envoyproxy.yaml.j2') | from_yaml }}"

- name: Create Gateway Class
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: envoy
      spec:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
        parametersRef:
          group: gateway.envoyproxy.io
          kind: EnvoyProxy
          name: envoy-proxy-config
          namespace: "{{ gateway_namespace }}"

- name: Create Gateway
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'gateway.yaml.j2') | from_yaml }}"

- name: Create Gateway Client Traffic Policy
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('template', 'clienttrafficpolicy.yaml.j2') | from_yaml }}

- name: Create HTTPS Redirect Route
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('template', 'httproute-https-redirect.yaml.j2') | from_yaml }}

- name: Enable Response Compression
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: BackendTrafficPolicy
      metadata:
        name: compression
        namespace: "{{ gateway_namespace }}"
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: "{{ gateway_name }}"
        compression:
          - type: Brotli
          - type: Gzip

- name: Create Envoy Proxy Pod Monitor
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: envoy-proxy
        namespace: "{{ gateway_namespace }}"
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/component: proxy
            app.kubernetes.io/managed-by: envoy-gateway
        podMetricsEndpoints:
          - port: metrics
            path: /stats/prometheus
