---
# Cluster-wide application operators used by workloads. Shared CRDs/controllers
# and domain-owned platform charts live in their own task files.
- name: Create CloudNativePG Namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cnpg-system
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

- name: Deploy operator charts
  ansible.builtin.include_role:
    name: helm
    tasks_from: deploy
  loop: "{{ core_operator_charts }}"
  loop_control:
    loop_var: core_chart
    label: "{{ core_chart.name }}"
  vars:
    helm_chart_name: "{{ core_chart.name }}"
    helm_chart_ref: "{{ core_chart.ref }}"
    helm_chart_version: "{{ core_chart.version }}"
    helm_chart_namespace: "{{ core_chart.namespace }}"
    helm_chart_values_template: >-
      {{ core_role_path }}/templates/values/{{ core_chart.name }}.yaml.j2
