---
# Ordering between these files is load-bearing. Hoisted files contain only
# shared prerequisites: Helm setup, namespaces used by more than one domain, and
# CRDs/controllers that multiple sections render resources from. Domain-owned
# namespaces and charts live with the task file that configures them.
#
# These are imports, not includes: tags on an include_tasks apply only to the
# include itself, so the tasks inside would be filtered out and a --tags run
# would silently do nothing. import_tasks propagates the tag at parse time.
- name: Prepare Helm
  ansible.builtin.import_tasks: prereq.yaml
  tags: [always]

- name: Create shared namespaces
  ansible.builtin.import_tasks: shared-namespaces.yaml
  tags:
    - certificates
    - monitoring
    - networking
    - operators
    - policies
    - shared
    - storage

- name: Deploy shared monitoring CRDs
  ansible.builtin.import_tasks: shared-monitoring-crds.yaml
  tags:
    - certificates
    - monitoring
    - networking
    - operators
    - shared
    - storage

- name: Deploy shared gateway controller
  ansible.builtin.import_tasks: shared-gateway.yaml
  tags:
    - monitoring
    - networking
    - policies
    - shared
    - storage

- name: Deploy operator charts
  ansible.builtin.import_tasks: operators.yaml
  tags: [operators]

- name: Configure storage
  ansible.builtin.import_tasks: storage.yaml
  tags: [storage]

- name: Configure certificates
  ansible.builtin.import_tasks: certificates.yaml
  tags: [certificates]

- name: Configure networking
  ansible.builtin.import_tasks: networking.yaml
  tags: [networking]

- name: Configure monitoring
  ansible.builtin.import_tasks: monitoring.yaml
  tags: [monitoring]

- name: Apply gateway policies
  ansible.builtin.import_tasks: policies.yaml
  tags: [policies]
