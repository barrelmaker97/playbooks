---
# Ordering between these files is load-bearing. The platform is moving to
# Flux from the bottom up, so Flux runs first: it owns the lowest layers
# (kubernetes/infrastructure), and its section waits for them before the
# sections below deploy charts on top of them. Helm setup runs before every
# section for the chart repositories. Domain-owned namespaces and charts live
# with the task file that configures them, while Gateway exposure is
# centralized in routing.
#
# These are imports, not includes: tags on an include_tasks apply only to the
# include itself, so the tasks inside would be filtered out and a --tags run
# would silently do nothing. import_tasks propagates the tag at parse time.
- name: Set core role path
  ansible.builtin.set_fact:
    core_role_path: "{{ role_path }}"
  tags: [always]

# include_role is dynamic: tags on it select only the include, so apply
# passes always down to the setup tasks. Without it, any --tags run skipped
# installing Helm and refreshing the chart repositories.
- name: Setup Helm
  ansible.builtin.include_role:
    name: helm
    tasks_from: setup
    apply:
      tags: [always]
  vars:
    helm_repos:
      grafana: https://grafana.github.io/helm-charts
      grafana-community: https://grafana-community.github.io/helm-charts
      metrics-server: https://kubernetes-sigs.github.io/metrics-server
      open-telemetry: https://open-telemetry.github.io/opentelemetry-helm-charts
      prometheus-community: https://prometheus-community.github.io/helm-charts
  tags: [always]

- name: Configure Flux
  ansible.builtin.import_tasks: flux.yaml
  tags: [flux]

- name: Configure monitoring
  ansible.builtin.import_tasks: monitoring.yaml
  tags: [monitoring]

- name: Configure routing
  ansible.builtin.import_tasks: routing.yaml
  tags: [routing]
