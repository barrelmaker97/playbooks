---
# Ordering between these files is load-bearing. Each chart that supplies a CRD
# must run before anything creating that kind, and namespaces must exist before
# resources land in them. prereq is tagged always: every other section needs
# core_role_path for its values path and the Helm repositories registered.
#
# These are imports, not includes: tags on an include_tasks apply only to the
# include itself, so the tasks inside would be filtered out and a --tags run
# would silently do nothing. import_tasks propagates the tag at parse time.
- name: Prepare Helm and shared CRDs
  ansible.builtin.import_tasks: prereq.yaml
  tags: [always]

- name: Deploy storage
  ansible.builtin.import_tasks: storage.yaml
  tags: [storage]

- name: Deploy networking
  ansible.builtin.import_tasks: networking.yaml
  tags: [networking]

- name: Deploy certificates
  ansible.builtin.import_tasks: certificates.yaml
  tags: [certificates]

- name: Deploy monitoring
  ansible.builtin.import_tasks: monitoring.yaml
  tags: [monitoring]
