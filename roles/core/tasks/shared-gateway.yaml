---
# The Gateway controller is shared because storage and monitoring charts render
# HTTPRoutes, while networking owns the Gateway configuration itself.
- name: Deploy shared gateway controller
  ansible.builtin.include_role:
    name: helm
    tasks_from: deploy
  loop: "{{ core_gateway_controller_charts }}"
  loop_control:
    loop_var: core_chart
    label: "{{ core_chart.name }}"
  vars:
    helm_chart_name: "{{ core_chart.name }}"
    helm_chart_ref: "{{ core_chart.ref }}"
    helm_chart_version: "{{ core_chart.version }}"
    helm_chart_namespace: "{{ core_chart.namespace }}"
    helm_chart_values_template: >-
      {{ core_role_path }}/templates/values/{{ core_chart.name }}.yaml.j2
