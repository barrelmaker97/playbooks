---
# Several domain charts render ServiceMonitor, PodMonitor, or PrometheusRule
# objects from their values. Install those CRDs before any of those charts run.
- name: Deploy shared monitoring CRDs
  ansible.builtin.include_role:
    name: helm
    tasks_from: deploy
  loop: "{{ core_monitoring_crd_charts }}"
  loop_control:
    loop_var: core_chart
    label: "{{ core_chart.name }}"
  vars:
    helm_chart_name: "{{ core_chart.name }}"
    helm_chart_ref: "{{ core_chart.ref }}"
    helm_chart_version: "{{ core_chart.version }}"
    helm_chart_namespace: "{{ core_chart.namespace }}"
    helm_chart_values_template: >-
      {{ core_role_path }}/templates/values/{{ core_chart.name }}.yaml.j2
