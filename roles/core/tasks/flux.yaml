---
- name: Create Flux Namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: flux-system

- name: Deploy Flux Operator
  ansible.builtin.include_role:
    name: helm
    tasks_from: deploy
  vars:
    helm_chart_name: flux-operator
    helm_chart_ref: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    helm_chart_version: "{{ flux_operator_version }}"
    helm_chart_namespace: flux-system

# The cluster's own age key, which decrypts only files under kubernetes/ (see
# .sops.yaml). Namespace is set here because the sops MAC covers metadata.
- name: Create Flux SOPS Age Key Secret
  kubernetes.core.k8s:
    state: present
    namespace: flux-system
    definition: "{{ lookup('community.sops.sops', 'files/secret-sops-age.sops.yaml') | from_yaml }}"
  no_log: true

- name: Create Flux Instance
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'fluxinstance.yaml.j2') | from_yaml }}"

- name: Wait for Flux Instance
  kubernetes.core.k8s_info:
    api_version: fluxcd.controlplane.io/v1
    kind: FluxInstance
    name: flux
    namespace: flux-system
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_sleep: 10
    wait_timeout: 600

# The layers Flux owns that the Ansible sections after this one build on. On
# a fresh cluster they must be Ready before those sections deploy charts into
# them. Each layer migrated to Flux is added here.
- name: Wait for Flux-managed layers
  kubernetes.core.k8s_info:
    api_version: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    name: "{{ core_flux_layer_name }}"
    namespace: flux-system
  register: core_flux_layer
  until: >-
    core_flux_layer.resources | length > 0 and
    (core_flux_layer.resources[0].status.conditions | default([])
     | selectattr('type', 'eq', 'Ready') | map(attribute='status')
     | first | default('')) == 'True'
  retries: 60
  delay: 10
  loop:
    - monitoring-prereq
  loop_control:
    loop_var: core_flux_layer_name
