---
- name: Create Cert Manager Namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager

- name: Deploy certificate charts
  ansible.builtin.include_role:
    name: helm
    tasks_from: deploy
  loop: "{{ core_certificate_charts }}"
  loop_control:
    loop_var: core_chart
    label: "{{ core_chart.name }}"
  vars:
    helm_chart_name: "{{ core_chart.name }}"
    helm_chart_ref: "{{ core_chart.ref }}"
    helm_chart_version: "{{ core_chart.version }}"
    helm_chart_namespace: "{{ core_chart.namespace }}"
    helm_chart_values_template: >-
      {{ core_role_path }}/templates/values/{{ core_chart.name }}.yaml.j2

- name: Create Internal Self-Signed Issuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: selfsigned-issuer
      spec:
        selfSigned: {}

- name: Create Internal Root CA Certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: internal-root-ca
        namespace: cert-manager
      spec:
        isCA: true
        commonName: "internal-root-ca"
        duration: 8760h  # 1 year
        renewBefore: 720h  # 30 days
        secretName: internal-root-ca-secret
        privateKey:
          algorithm: ECDSA
          size: 256
        issuerRef:
          name: selfsigned-issuer
          kind: ClusterIssuer
          group: cert-manager.io

- name: Create Internal CA Issuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: internal-ca
      spec:
        ca:
          secretName: internal-root-ca-secret

- name: Create Trust Bundle
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      metadata:
        name: internal-trust
      spec:
        sources:
          - secret:
              name: internal-root-ca-secret
              key: ca.crt
        target:
          configMap:
            key: ca-certificates.crt

# sops-encrypted manifests set namespace on the task rather than in metadata:
# the MAC covers the whole document, so metadata cannot be edited without
# re-encrypting. Plain manifests carry their own namespace.
- name: Create Cloudflare API Token Secret
  kubernetes.core.k8s:
    state: present
    namespace: cert-manager
    definition: "{{ lookup('community.sops.sops', 'files/secret-cloudflare-api-token.sops.yaml') | from_yaml }}"

- name: Create Production Issuer
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'issuer-prod.yaml.j2') | from_yaml }}"

- name: Create Staging Issuer
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'issuer-staging.yaml.j2') | from_yaml }}"

# These must follow cert-manager and the issuers above: the Certificate CRD
# arrives with the cert-manager chart, and each certificate names an issuer
# created just above it. The Gateway can reference the resulting secrets after
# networking creates it.
- name: Create LAN TLS Certificates
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'certificates-lan.yaml.j2') | from_yaml }}"

- name: Create Public TLS Certificates
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('template', 'certificates-public.yaml.j2') | from_yaml }}
