---
# Values only this role reads. The core_ prefix satisfies ansible-lint's
# var-naming[no-role-prefix] rule; group_vars/all.yaml overrides anything here.
core_prometheus_crds_version: "28.0.0"
core_longhorn_version: "1.12.1"
core_cloudnative_pg_chart_version: "0.29.0"
core_metallb_version: "0.16.1"
core_envoy_gateway_version: "v1.8.1"  # OCI chart tags are v-prefixed
core_cert_manager_version: "1.21.1"
core_trust_manager_version: "0.24.0"
core_loki_version: "6.53.0"
core_tempo_version: "1.26.5"
core_otel_collector_version: "0.145.0"
core_kube_prometheus_stack_version: "82.13.0"
core_metrics_server_version: "3.13.1"

# Contact address registered with the ACME issuers
core_email_address: nolancooper97@gmail.com

core_metallb_ip_range: 192.168.15.60-192.168.15.69
# IP for the Envoy Gateway LoadBalancer service, allocated from the range above
core_gateway_ip: 192.168.15.60

# Hard cap on snapshots per volume; blocks new snapshots once reached. The
# alert in prometheusrule-longhorn-snapshots fires just below this value.
core_longhorn_snapshot_max_count: 50
