---
- name: Validate Role Inputs
  ansible.builtin.assert:
    that:
      - cloudnative_pg_cluster_name | default("") | length > 0
      - cloudnative_pg_cluster is defined
      - cloudnative_pg_image | default("") | length > 0
    fail_msg: >-
      cloudnative_pg requires cloudnative_pg_cluster_name,
      cloudnative_pg_cluster, and cloudnative_pg_image.

- name: Validate Cluster Configuration
  ansible.builtin.assert:
    that:
      - cloudnative_pg_cluster.namespace | default("") | length > 0
      - cloudnative_pg_cluster.description | default("") | length > 0
      - cloudnative_pg_cluster.instances | int > 0
      - cloudnative_pg_cluster.database | default("") | length > 0
      - cloudnative_pg_cluster.owner | default("") | length > 0
      - cloudnative_pg_cluster.storage_size | default("") | length > 0
      - cloudnative_pg_cluster.resources is mapping
      - >-
        (cloudnative_pg_cluster.availability_alert_severity | default(""))
        in ["warning", "critical"]
    fail_msg: >-
      CloudNativePG cluster {{ cloudnative_pg_cluster_name }} has invalid or
      incomplete configuration.

- name: Create Cluster
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'cluster.yaml.j2') | from_yaml }}"

- name: Create Pod Monitor
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'podmonitor.yaml.j2') | from_yaml }}"

- name: Create Alert Rules
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'prometheusrule.yaml.j2') | from_yaml }}"

- name: Wait for Cluster
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ cloudnative_pg_cluster_name }}"
    namespace: "{{ cloudnative_pg_cluster.namespace }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_sleep: 10
    wait_timeout: 900
