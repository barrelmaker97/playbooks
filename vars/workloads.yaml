---
workloads_namespaces:
  barrelmaker:
    labels: {}
    requests_cpu: "10"
    requests_memory: 30Gi
  obscura:
    labels:
      pod-security.kubernetes.io/enforce: baseline
      pod-security.kubernetes.io/audit: restricted
      pod-security.kubernetes.io/warn: restricted
    requests_cpu: "2"
    requests_memory: 4Gi
  obscura-dev:
    labels:
      pod-security.kubernetes.io/enforce: baseline
      pod-security.kubernetes.io/audit: restricted
      pod-security.kubernetes.io/warn: restricted
    requests_cpu: "2"
    requests_memory: 4Gi

workloads_postgresql_image: >-
  ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:ebf3919504d7523a63e8e2fee9b051211de714644b36469275558c624afd50ec

workloads_postgresql_clusters:
  obscura-postgres:
    namespace: obscura
    description: Production PostgreSQL cluster for Obscura
    instances: 3
    enable_pdb: true
    database: obscura
    owner: obscura
    storage_size: 8Gi
    availability_alert_severity: critical
    synchronous:
      method: any
      number: 1
      data_durability: required
    parameters:
      idle_in_transaction_session_timeout: 5min
      track_io_timing: "on"
      track_wal_io_timing: "on"
    pg_hba:
      - hostnossl all all all reject
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
  devscura-postgres:
    namespace: obscura-dev
    description: Development PostgreSQL cluster for Obscura
    instances: 1
    enable_pdb: false
    database: obscura
    owner: obscura
    storage_size: 8Gi
    availability_alert_severity: warning
    parameters:
      idle_in_transaction_session_timeout: 5min
      track_io_timing: "on"
      track_wal_io_timing: "on"
    pg_hba:
      - hostnossl all all all reject
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

workloads_helm_releases:
  jellyfin:
    ref: barrelmaker/jellyfin
    namespace: barrelmaker
  niucraft:
    ref: barrelmaker/minecraft
    namespace: barrelmaker
  pistachio:
    ref: barrelmaker/pistachio
    version: 0.3.1
    namespace: barrelmaker
  website:
    ref: barrelmaker/website
    version: 0.6.2
    namespace: barrelmaker
  factorio:
    ref: barrelmaker/factorio
    namespace: barrelmaker
  loch:
    ref: barrelmaker/factorio
    namespace: barrelmaker
  obscura:
    ref: barrelmaker/obscura
    version: 0.12.3
    namespace: obscura
  devscura:
    ref: barrelmaker/obscura
    version: 0.12.3
    namespace: obscura-dev
  # gmod:
  #   ref: barrelmaker/gmod
  #   namespace: barrelmaker
  # valheim:
  #   ref: barrelmaker/valheim
  #   namespace: barrelmaker
  # satisfactory:
  #   ref: barrelmaker/satisfactory
  #   namespace: barrelmaker
  #   timeout: 10m
