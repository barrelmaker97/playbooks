---
# Read by core.yaml. Values shared with other playbooks live in
# group_vars/all.yaml instead.

# Chart versions
longhorn_version: "1.12.1"
cloudnative_pg_chart_version: "0.29.0"
metallb_version: "0.16.1"
envoy_gateway_version: "v1.8.1"  # OCI chart tags are v-prefixed
cert_manager_version: "1.21.2"
trust_manager_version: "0.25.0"
loki_version: "6.53.0"
tempo_version: "1.26.5"
otel_collector_version: "0.145.0"
kube_prometheus_stack_version: "82.13.0"
metrics_server_version: "3.14.0"
flux_operator_version: "0.60.0"

# Contact address registered with the ACME issuers
email_address: nolancooper97@gmail.com

metallb_ip_range: 192.168.15.60-192.168.15.69
# IP for the Envoy Gateway LoadBalancer service, allocated from the range above
gateway_ip: 192.168.15.60

# Hard cap on snapshots per volume; blocks new snapshots once reached. The
# alert in prometheusrule-longhorn-snapshots fires just below this value.
longhorn_snapshot_max_count: 50

# Flux syncs flux_sync_path from this repository. flux_version is the Flux
# distribution the operator installs, separate from the operator chart itself.
# A semver range: the operator applies Flux patch releases on its own.
flux_version: "2.9.x"
flux_sync_url: https://github.com/barrelmaker97/playbooks.git
flux_sync_ref: refs/heads/main
flux_sync_path: kubernetes/clusters/poseidon
